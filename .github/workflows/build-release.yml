name: Build release package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build portable ZIP
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build genuine ZIP archive
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = (Get-Content -LiteralPath "VERSION" -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }

          $archiveName = "vlc-432hz-tuning-$version.zip"
          $distDirectory = Join-Path $PWD "dist"
          $packageDirectory = Join-Path $distDirectory "package"
          $archivePath = Join-Path $distDirectory $archiveName
          $checksumPath = "$archivePath.sha256"

          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null

          $releaseFiles = @(
            "VLC-432Hz-tuning.lua",
            "README.md",
            "VERSION",
            "install-windows.bat",
            "install-windows.ps1",
            "install-linux.sh",
            "install-macos.sh"
          )

          foreach ($releaseFile in $releaseFiles) {
            if (-not (Test-Path -LiteralPath $releaseFile -PathType Leaf)) {
              throw "Required release file is missing: $releaseFile"
            }
            Copy-Item -LiteralPath $releaseFile -Destination $packageDirectory
          }

          Compress-Archive -Path "$packageDirectory\*" -DestinationPath $archivePath -CompressionLevel Optimal

          $validationDirectory = Join-Path $distDirectory "validation"
          Expand-Archive -LiteralPath $archivePath -DestinationPath $validationDirectory
          foreach ($releaseFile in $releaseFiles) {
            $validatedFile = Join-Path $validationDirectory $releaseFile
            if (-not (Test-Path -LiteralPath $validatedFile -PathType Leaf)) {
              throw "ZIP validation failed; file is missing: $releaseFile"
            }
          }

          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -LiteralPath $checksumPath -Encoding ascii

          "version=$version" >> $env:GITHUB_OUTPUT
          "archive_name=$archiveName" >> $env:GITHUB_OUTPUT
          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlc-432hz-tuning-${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish tagged GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME

          $releaseExists = $false
          try {
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            $releaseExists = $LASTEXITCODE -eq 0
          }
          catch {
            $releaseExists = $false
          }

          if ($releaseExists) {
            gh release upload $tag $env:ARCHIVE_PATH $env:CHECKSUM_PATH --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $tag $env:ARCHIVE_PATH $env:CHECKSUM_PATH --verify-tag --generate-notes --title "VLC 432 Hz Tuning $tag" --repo $env:GITHUB_REPOSITORY
          }
